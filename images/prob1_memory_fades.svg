  <text x="720" y="256" text-anchor="middle" font-size="36">🏯</text>
  <text x="720" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffd60a" font-weight="700">프리미어</text>

  <rect x="778" y="210" width="90" height="90" rx="14" fill="rgba(0,113,227,0.15)" stroke="rgba(0,113,227,0.4)" stroke-width="1.5"/>
  <text x="823" y="256" text-anchor="middle" font-size="36">🌊</text>
  <text x="823" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4aabff" font-weight="700">희귀</text>

  <rect x="881" y="210" width="90" height="90" rx="14" fill="rgba(175,82,222,0.15)" stroke="rgba(175,82,222,0.4)" stroke-width="1.5"/>
  <text x="926" y="256" text-anchor="middle" font-size="36">🍊</text>
  <text x="926" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bf5af2" font-weight="700">특별</text>

  <rect x="984" y="210" width="90" height="90" rx="14" fill="rgba(134,134,139,0.15)" stroke="rgba(134,134,139,0.4)" stroke-width="1.5"/>
  <text x="1029" y="256" text-anchor="middle" font-size="36">🌸</text>
  <text x="1029" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#86868b" font-weight="700">일반</text>

  <rect x="675" y="313" width="90" height="90" rx="14" fill="rgba(52,199,89,0.15)" stroke="rgba(52,199,89,0.4)" stroke-width="1.5"/>
  <text x="720" y="359" text-anchor="middle" font-size="36">🎋</text>
  <text x="720" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34c759" font-weight="700">특별</text>

  <rect x="778" y="313" width="90" height="90" rx="14" fill="rgba(255,159,10,0.15)" stroke="rgba(255,159,10,0.4)" stroke-width="1.5"/>
  <text x="823" y="359" text-anchor="middle" font-size="36">🏔️</text>
  <text x="823" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ff9f0a" font-weight="700">희귀</text>

  <rect x="881" y="313" width="90" height="90" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" opacity="0.4"/>
  <text x="926" y="364" text-anchor="middle" font-size="28">🔒</text>
  <rect x="984" y="313" width="90" height="90" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" opacity="0.4"/>
  <text x="1029" y="364" text-anchor="middle" font-size="28">🔒</text>

  <!-- Benefits -->
  <rect x="675" y="420" width="450" height="50" rx="10" fill="rgba(52,199,89,0.1)"/>
  <text x="705" y="443" font-family="Arial, sans-serif" font-size="22">🗺️</text>
  <text x="740" y="440" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white">방문 기록이 배지로 영구 보존</text>
  <text x="740" y="458" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">언제 어디서 획득했는지 날짜·위치 자동 기록</text>

  <rect x="675" y="480" width="450" height="50" rx="10" fill="rgba(52,199,89,0.1)"/>
  <text x="705" y="503" font-family="Arial, sans-serif" font-size="22">🏆</text>
  <text x="740" y="500" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white">컬렉션 뷰로 내 여행 히스토리 한눈에</text>
  <text x="740" y="518" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">지역별·등급별 필터, 타임라인 뷰 제공</text>

  <!-- Bottom -->
  <rect x="50" y="568" width="1100" height="72" rx="16" fill="rgba(255,214,10,0.08)" stroke="rgba(255,214,10,0.25)" stroke-width="1.5"/>
  <text x="600" y="596" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.4)">Voyna 슬로건</text>
  <text x="600" y="624" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#ffd60a">"발걸음이 기록이 되고, 기록이 추억이 된다"</text>

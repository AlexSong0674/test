<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/><stop offset="100%" style="stop-color:#0d1b3e"/>
    </linearGradient>
    <linearGradient id="before" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a"/><stop offset="100%" style="stop-color:#2a1010"/>
    </linearGradient>
    <linearGradient id="after" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a0a"/><stop offset="100%" style="stop-color:#0d2a10"/>
    </linearGradient>
    <linearGradient id="goldg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd60a"/><stop offset="100%" style="stop-color:#ff9f0a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g opacity="0.04" stroke="white" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/><line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- Header -->
  <rect x="40" y="30" width="200" height="32" rx="16" fill="rgba(255,59,48,0.2)" stroke="#ff3b30" stroke-width="1"/>
  <text x="140" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ff6b63">🔴 문제 해결 01</text>

  <text x="600" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="white">여행의 기억, 시간이 지나면 사라집니다</text>
  <text x="600" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)">사진 수천 장도 결국 파편화 — Voyna는 방문 기록을 배지로 영구 보존합니다</text>

  <!-- BEFORE panel -->
  <rect x="50" y="158" width="500" height="390" rx="20" fill="url(#before)" stroke="rgba(255,59,48,0.3)" stroke-width="1.5"/>
  <rect x="50" y="158" width="500" height="4" rx="2" fill="#ff3b30"/>
  <text x="300" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#ff6b63">😔 Before — 지금의 현실</text>

  <!-- Scattered photos illustration -->
  <rect x="80" y="210" width="90" height="70" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1" transform="rotate(-8,125,245)"/>
  <text x="125" y="250" text-anchor="middle" font-size="28" transform="rotate(-8,125,245)">🏯</text>
  <rect x="190" y="220" width="90" height="70" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1" transform="rotate(5,235,255)"/>
  <text x="235" y="260" text-anchor="middle" font-size="28" transform="rotate(5,235,255)">🌊</text>
  <rect x="310" y="205" width="90" height="70" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1" transform="rotate(-4,355,240)"/>
  <text x="355" y="245" text-anchor="middle" font-size="28" transform="rotate(-4,355,240)">🍊</text>
  <rect x="130" y="295" width="90" height="70" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1" transform="rotate(6,175,330)"/>
  <text x="175" y="335" text-anchor="middle" font-size="28" transform="rotate(6,175,330)">🌸</text>
  <rect x="260" y="290" width="90" height="70" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1" transform="rotate(-7,305,325)"/>
  <text x="305" y="330" text-anchor="middle" font-size="28" transform="rotate(-7,305,325)">🎋</text>

  <text x="300" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.3)">📁 사진 3,284장 보관 중…</text>

  <!-- Pain points -->
  <rect x="75" y="420" width="450" height="50" rx="10" fill="rgba(255,59,48,0.1)"/>
  <text x="105" y="443" font-family="Arial, sans-serif" font-size="22">😕</text>
  <text x="140" y="440" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white">"내가 거기 갔었나?" — 기억이 흐릿해짐</text>
  <text x="140" y="458" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">사진은 많지만 언제, 어디서, 몇 번째 방문인지 불분명</text>

  <rect x="75" y="480" width="450" height="50" rx="10" fill="rgba(255,59,48,0.1)"/>
  <text x="105" y="503" font-family="Arial, sans-serif" font-size="22">📊</text>
  <text x="140" y="500" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white">내 여행 히스토리를 한눈에 볼 수 없음</text>
  <text x="140" y="518" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">갤러리 수천 장 중 여행 사진만 따로 정리하기 어려움</text>

  <!-- Arrow -->
  <text x="578" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="50" fill="url(#goldg)">→</text>


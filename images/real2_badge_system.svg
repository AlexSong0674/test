  <text x="462" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#4aabff">+150 XP</text>
  <text x="358" y="412" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)">📍 조건: 첫 100명 방문자</text>

  <text x="80" y="432" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)">⚡ 획득: 자동 인증</text>
  <text x="80" y="452" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)">🗺️ 전국 수천 개 명소</text>


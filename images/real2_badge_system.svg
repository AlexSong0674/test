  <rect x="333" y="158" width="258" height="320" rx="20" fill="rgba(0,113,227,0.1)" stroke="rgba(0,113,227,0.45)" stroke-width="1.5"/>
  <rect x="333" y="158" width="258" height="5" rx="2" fill="url(#rare)"/>
  <circle cx="462" cy="240" r="52" fill="rgba(0,113,227,0.2)" stroke="rgba(0,113,227,0.5)" stroke-width="2"/>

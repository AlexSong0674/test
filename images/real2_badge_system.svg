<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/><stop offset="100%" style="stop-color:#0d1b3e"/>
    </linearGradient>
    <linearGradient id="common" x1="135deg" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#636366"/><stop offset="100%" style="stop-color:#3a3a3c"/>
    </linearGradient>
    <linearGradient id="rare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071e3"/><stop offset="100%" style="stop-color:#5856d6"/>
    </linearGradient>
    <linearGradient id="special" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#af52de"/><stop offset="100%" style="stop-color:#bf5af2"/>
    </linearGradient>
    <linearGradient id="premier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd60a"/><stop offset="100%" style="stop-color:#ff9f0a"/>
    </linearGradient>
    <linearGradient id="xpbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0071e3"/><stop offset="100%" style="stop-color:#34c759"/>
    </linearGradient>

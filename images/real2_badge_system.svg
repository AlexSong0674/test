  <text x="75" y="572" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Lv 1→2</text>
  <rect x="135" y="562" width="200" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <g opacity="0.04" stroke="white" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/><line x1="600" y1="0" x2="600" y2="675"/><line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <rect x="40" y="30" width="200" height="32" rx="16" fill="rgba(0,113,227,0.2)" stroke="#0071e3" stroke-width="1"/>
  <text x="140" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#4aabff">🚀 아이디어 실현 02</text>

  <text x="600" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="white">4등급 배지 시스템 — 수집의 재미와 희소성</text>
  <text x="600" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)">등급별 차별화된 획득 방식·XP·연출로 강력한 수집 동기 부여</text>

  <!-- 4 Badge Grade Cards -->

  <!-- COMMON -->
  <rect x="55" y="158" width="258" height="320" rx="20" fill="rgba(99,99,102,0.12)" stroke="rgba(99,99,102,0.4)" stroke-width="1.5"/>
  <rect x="55" y="158" width="258" height="5" rx="2" fill="url(#common)"/>
  <circle cx="184" cy="240" r="52" fill="rgba(99,99,102,0.2)" stroke="rgba(99,99,102,0.5)" stroke-width="2"/>
  <text x="184" y="258" text-anchor="middle" font-size="44">🏅</text>
  <text x="184" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="white">일반</text>
  <text x="184" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">Common</text>

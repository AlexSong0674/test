  <text x="345" y="572" font-family="Arial, sans-serif" font-size="11" fill="#4aabff">100 XP</text>
  <text x="75" y="595" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Lv 10→11</text>
  <rect x="135" y="585" width="200" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="135" y="585" width="100" height="10" rx="5" fill="url(#xpbar)"/>
  <text x="345" y="595" font-family="Arial, sans-serif" font-size="11" fill="#4aabff">2,512 XP</text>
  <text x="75" y="618" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Lv 50→51</text>
  <rect x="135" y="608" width="200" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="135" y="608" width="185" height="10" rx="5" fill="url(#xpbar)"/>
  <text x="345" y="618" font-family="Arial, sans-serif" font-size="11" fill="#4aabff">39,821 XP</text>

  <rect x="615" y="495" width="530" height="140" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="880" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="white">🏆 주요 칭호 시스템</text>
  <g font-family="Arial, sans-serif" font-size="12">
    <text x="635" y="548" fill="rgba(255,255,255,0.6)">🌱 <tspan font-weight="700" fill="white">동네 탐험가</tspan> — 배지 5개 달성</text>
    <text x="635" y="570" fill="rgba(255,255,255,0.6)">🗺️ <tspan font-weight="700" fill="white">국내 여행러</tspan> — 3개 광역시·도 보유</text>
    <text x="635" y="592" fill="rgba(255,255,255,0.6)">🏔️ <tspan font-weight="700" fill="white">전국 방랑자</tspan> — 모든 광역시·도 1개+</text>
    <text x="635" y="614" fill="rgba(255,255,255,0.6)">👑 <tspan font-weight="700" fill="#ffd60a">전설의 여행자</tspan> — Lv99 + 배지 200개</text>

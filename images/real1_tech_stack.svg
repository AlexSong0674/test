  <rect x="710" y="198" width="220" height="82" rx="12" fill="rgba(255,214,10,0.1)" stroke="rgba(255,214,10,0.3)" stroke-width="1"/>
  <text x="745" y="228" font-family="Arial, sans-serif" font-size="26">🗺️</text>
  <text x="785" y="225" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="white">카카오맵 API</text>
  <text x="785" y="244" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">월 300만 건 무료</text>
  <text x="785" y="262" font-family="Arial, sans-serif" font-size="11" fill="#ffd60a">지도 + GPS 지오펜싱</text>

  <text x="955" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.2)">+</text>


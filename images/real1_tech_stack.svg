  <text x="800" y="416" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.35)" font-family="monospace">users · locations · badges</text>
  <text x="800" y="432" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.35)" font-family="monospace">user_badges · xp_log · seasons</text>
  <text x="800" y="448" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.35)" font-family="monospace">subscriptions</text>

  <!-- Arrow down -->
  <text x="600" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.2)">↕</text>

  <!-- Bottom stats -->
  <rect x="80" y="510" width="490" height="108" rx="16" fill="rgba(255,159,10,0.08)" stroke="rgba(255,159,10,0.25)" stroke-width="1.5"/>
  <text x="325" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ff9f0a">⚡ 개발 속도 우위</text>
  <text x="325" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="white">12주 내 MVP 출시</text>
  <text x="325" y="586" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.4)">코딩 비전공자 창업자 · 노코드 스택</text>
  <text x="325" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.4)">서울 명소 50곳 배지 DB 사전 구성 완료</text>

  <rect x="630" y="510" width="490" height="108" rx="16" fill="rgba(52,199,89,0.08)" stroke="rgba(52,199,89,0.25)" stroke-width="1.5"/>
  <text x="875" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#34c759">💰 초기 비용 최소화</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">
    <text x="660" y="562">✓ FlutterFlow 무료 플랜으로 시작</text>
    <text x="660" y="583">✓ Supabase 무료 티어 (500MB DB)</text>
    <text x="660" y="604">✓ 카카오맵 월 300만 건 무료</text>
  </g>
</svg>

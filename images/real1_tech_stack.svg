<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/><stop offset="100%" style="stop-color:#0d1b3e"/>
    </linearGradient>
    <linearGradient id="layer1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001a40"/><stop offset="100%" style="stop-color:#002a60"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001a20"/><stop offset="100%" style="stop-color:#002a30"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1000"/><stop offset="100%" style="stop-color:#2a1800"/>
    </linearGradient>
    <linearGradient id="blueg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0071e3"/><stop offset="100%" style="stop-color:#5856d6"/>
    </linearGradient>
    <linearGradient id="greeng" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34c759"/><stop offset="100%" style="stop-color:#30d158"/>
    </linearGradient>
    <linearGradient id="orangeg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9f0a"/><stop offset="100%" style="stop-color:#ffd60a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g opacity="0.04" stroke="white" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/><line x1="600" y1="0" x2="600" y2="675"/><line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <rect x="40" y="30" width="200" height="32" rx="16" fill="rgba(0,113,227,0.2)" stroke="#0071e3" stroke-width="1"/>
  <text x="140" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#4aabff">🚀 아이디어 실현 01</text>

  <text x="600" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="white">노코드·로우코드로 12주 내 MVP 출시</text>
  <text x="600" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)">코딩 비전공자도 실현 가능한 검증된 기술 스택 — 빠르고 저렴하게</text>

  <!-- Architecture layers -->

  <!-- LAYER 1: Frontend -->
  <rect x="80" y="160" width="1040" height="135" rx="16" fill="url(#layer1)" stroke="rgba(0,113,227,0.4)" stroke-width="1.5"/>
  <rect x="80" y="160" width="1040" height="4" rx="2" fill="url(#blueg)"/>
  <text x="110" y="188" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="rgba(0,113,227,0.8)">📱 LAYER 1 — 앱 프론트엔드</text>

  <!-- FlutterFlow -->
  <rect x="110" y="198" width="280" height="82" rx="12" fill="rgba(0,113,227,0.15)" stroke="rgba(0,113,227,0.35)" stroke-width="1"/>
  <text x="145" y="228" font-family="Arial, sans-serif" font-size="26">⚡</text>
  <text x="185" y="225" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="white">FlutterFlow</text>
  <text x="185" y="244" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">노코드 앱 빌더</text>
  <text x="185" y="262" font-family="Arial, sans-serif" font-size="11" fill="#4aabff">iOS + Android 동시 빌드</text>

  <text x="415" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.2)">+</text>

  <!-- FCM -->
  <rect x="440" y="198" width="220" height="82" rx="12" fill="rgba(255,159,10,0.1)" stroke="rgba(255,159,10,0.3)" stroke-width="1"/>
  <text x="475" y="228" font-family="Arial, sans-serif" font-size="26">🔔</text>
  <text x="515" y="225" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="white">FCM</text>
  <text x="515" y="244" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Firebase 푸시 알림</text>
  <text x="515" y="262" font-family="Arial, sans-serif" font-size="11" fill="#ff9f0a">배지 근접 알림</text>

  <text x="685" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.2)">+</text>


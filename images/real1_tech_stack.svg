  <rect x="980" y="198" width="115" height="82" rx="12" fill="rgba(175,82,222,0.1)" stroke="rgba(175,82,222,0.3)" stroke-width="1"/>
  <text x="1037" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="26">🎛️</text>
  <text x="1037" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="white">Lovable</text>
  <text x="1037" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#bf5af2">관리자 대시보드</text>


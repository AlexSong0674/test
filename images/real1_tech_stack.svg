  <!-- Supabase -->
  <rect x="110" y="373" width="340" height="82" rx="12" fill="rgba(52,199,89,0.12)" stroke="rgba(52,199,89,0.35)" stroke-width="1"/>
  <text x="150" y="403" font-family="Arial, sans-serif" font-size="26">🗄️</text>
  <text x="195" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="white">Supabase</text>
  <text x="195" y="419" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">PostgreSQL 기반 BaaS</text>
  <text x="195" y="437" font-family="Arial, sans-serif" font-size="11" fill="#34c759">무료 플랜으로 MVP 가능 · RLS 보안</text>

  <text x="475" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.2)">+</text>

  <!-- Auth -->
  <rect x="500" y="373" width="220" height="82" rx="12" fill="rgba(52,199,89,0.08)" stroke="rgba(52,199,89,0.25)" stroke-width="1"/>
  <text x="535" y="403" font-family="Arial, sans-serif" font-size="26">🔐</text>
  <text x="575" y="400" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="white">Supabase Auth</text>
  <text x="575" y="419" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">소셜 로그인 통합</text>
  <text x="575" y="437" font-family="Arial, sans-serif" font-size="11" fill="#34c759">카카오 / 구글 OAuth</text>

  <text x="745" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.2)">+</text>


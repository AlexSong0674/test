<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/><stop offset="100%" style="stop-color:#0d1b3e"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0071e3"/><stop offset="100%" style="stop-color:#5856d6"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34c759"/><stop offset="100%" style="stop-color:#30d158"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g opacity="0.04" stroke="white" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/><line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <rect x="40" y="30" width="220" height="32" rx="16" fill="rgba(0,113,227,0.2)" stroke="#0071e3" stroke-width="1"/>
  <text x="150" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#4aabff">💡 아이디어 배경 — 시장 트렌드</text>

  <text x="600" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="white">국내 여행 & 인증 문화, 지금이 적기입니다</text>
  <text x="600" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)">세 가지 거대한 흐름이 Voyna의 등장을 가리키고 있습니다</text>

  <!-- Stat cards row -->
  <rect x="50" y="158" width="340" height="110" rx="16" fill="rgba(0,113,227,0.1)" stroke="rgba(0,113,227,0.3)" stroke-width="1.5"/>
  <text x="230" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#4aabff">연 3억+</text>
  <text x="230" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">국내 연간 여행 횟수</text>
  <text x="230" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">(한국관광공사, 2023)</text>

  <rect x="430" y="158" width="340" height="110" rx="16" fill="rgba(52,199,89,0.1)" stroke="rgba(52,199,89,0.3)" stroke-width="1.5"/>
  <text x="600" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#34c759">87%</text>
  <text x="600" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">MZ세대 여행 후 SNS 인증 경험</text>
  <text x="600" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">(대한상공회의소, 2023)</text>

  <rect x="810" y="158" width="340" height="110" rx="16" fill="rgba(255,214,10,0.1)" stroke="rgba(255,214,10,0.3)" stroke-width="1.5"/>
  <text x="980" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#ffd60a">400만+</text>
  <text x="980" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">지자체 스탬프 투어 연간 참여자</text>
  <text x="980" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">(문화체육관광부, 2023)</text>

